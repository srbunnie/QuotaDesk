name: leak-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4.2.2, fixado por commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Arquivos versionados
        shell: pwsh
        env:
          LEAK_SCAN_DENYLIST: ${{ secrets.LEAK_SCAN_DENYLIST }}
        run: ./scripts/scan-leaks.ps1 -All
      - name: Histórico
        shell: pwsh
        env:
          LEAK_SCAN_DENYLIST: ${{ secrets.LEAK_SCAN_DENYLIST }}
        run: ./scripts/scan-leaks.ps1 -History
